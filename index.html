<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Yarndings+12&display=swap"
      rel="stylesheet"
    />
    <title>Glide</title>
</head>
<body>
    <header>
        <p class="logo"> Glide</p>
        <ul>
            <li>Product</li>
            <li>Enterprise</li>
            <li>Customers</li>
            <li>Resource</li>
            <li>Pricing</li>
        </ul>

        <ul>
            <li><i class="fa-solid fa-magnifying-glass"></i></li>
            <li><button class="white-btn">Log In</button></li>
            <li><button class="white-btn">Contact Sales</button></li>
            <li><button class="black-btn">Start for free</button></li>         
        </ul>
    </header>

    <section class="hero">
        <div class="description">
            <div>
                <p class="short-desc">Inventory Management Software</p>
                <h1>Build custom inventory management software <br>with AI</h1>
                <p>Stay ahead of demand, prevent stockouts, and <br>streamline fulfillment with AI-powered software <br>tailored to how you move inventory.</p>
            </div>
            <div>
                <textarea placeholder="Describe what you want to build..."></textarea>
                    <section class="buttons">
                        <button class="clip"><i class="fa-solid fa-paperclip"></i>  Upload Sheet</button>
                        <button class="black">build app</button>
                    </section>
                
            </div>
        </div>
        <div class="image">
            <img src="image.jpeg" alt="Image">
        </div>
    </section>
</body>
</html>
